include:
  - compose.base.yml

services:
  mlc-backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    ports:
      - 4001:3001
    # env_file:
    #   - ./apps/backend/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mlc?schema=public"
      WATCHPACK_POLLING: true
    depends_on:
      postgres:
        condition: service_started
      init-db-from-snapshot:
        condition: service_completed_successfully 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 1s
      timeout: 200ms
      retries: 3
      start_period: 1s
    develop:
      watch:
        - action: rebuild
          path: ./apps/backend
          include:
            - .env
            - "Dockerfile*"

        - action: sync
          path: ./apps/backend
          target: /opt/mlc/apps/backend
          ignore:
            - "Dockerfile*"
            - .vs/
            - .vscode/
            - node_modules/
            - dist/
            - "*.log"
            - package.json
            - package-lock.json

