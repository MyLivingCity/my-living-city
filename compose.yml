services:
  postgres:
    image: postgres:12
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=mlc
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  init-db-from-snapshot:
    image: alpine:3.18
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./db:/var/run/db
    command: >
      /bin/sh -c "
        if [ -f /var/run/db/db_init.tar ]; then
          apk update && apk add postgresql13-client &&

          export PGPASSWORD=postgres &&
          /usr/libexec/postgresql13/pg_restore -h postgres -U postgres -p 5432 -d mlc --verbose /var/run/db/db_init.tar
        else
          echo 'Database restore file not found, skipping...'
        fi
        
        exit 0
      "

  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile.dev
    ports:
      - 3001:3001
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mlc?schema=public"
      WATCHPACK_POLLING: true
    depends_on:
      postgres:
        condition: service_started
      init-db-from-snapshot:
        condition: service_completed_successfully 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 1s
      timeout: 200ms
      retries: 3
      start_period: 1s
    develop:
      watch:
        - action: rebuild
          path: ./server
          include:
            - .env
            - "Dockerfile*"
            - package-lock.json

        - action: sync
          path: ./server
          target: /opt/server
          ignore:
            - "Dockerfile*"
            - .vs/
            - .vscode/
            - node_modules/
            - dist/
            - "*.log"
            - package.json
            - package-lock.json

  frontend:
    stdin_open: true
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - 3000:3000
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          include:
            - .env
            - "Dockerfile*"
            - package-lock.json

        - action: sync
          path: ./frontend
          target: /opt/app
          ignore:
            - "Dockerfile*"
            - .vs/
            - .vscode/
            - node_modules/
            - dist/
            - "*.log"
            - package.json
            - package-lock.json
