include:
  - compose.base.yml

services:
  mlc-backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    ports:
      - 4001:3001
    # env_file:
    #   - ./apps/backend/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mlc?schema=public"
      WATCHPACK_POLLING: true
    depends_on:
      postgres:
        condition: service_started
      init-db-from-snapshot:
        condition: service_completed_successfully 
    develop:
      watch:
        - action: rebuild
          path: ./apps/backend
          include:
            - .env
            - "Dockerfile*"

        - action: sync
          path: ./apps/backend
          target: /opt/mlc/apps/backend
          ignore:
            - "Dockerfile*"
            - .vs/
            - .vscode/
            - node_modules/
            - dist/
            - "*.log"
            - package.json
            - package-lock.json

  mlc-frontend:
    stdin_open: true
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    ports:
      - 4000:5173
    depends_on:
      mlc-backend:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./apps/frontend
          include:
            - .env
            - "Dockerfile*"

        - action: sync
          path: ./apps/frontend
          target: /opt/mlc/apps/frontend
          ignore:
            - "Dockerfile*"
            - .vs/
            - .vscode/
            - node_modules/
            - dist/
            - "*.log"
            - package.json
            - package-lock.json
